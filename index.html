<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&S - Fatih Sadak | Dijital Çözümler</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: #141419;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px 120px 20px;
            overflow-x: hidden;
        }

        /* Giriş (Splash) Ekranı */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050508;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
            max-width: 400px;
            margin: auto;
        }

        .splash-logo {
            font-family: 'Times New Roman', serif; /* Logonun o prestijli font havası için */
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: -10px;
        }

        .splash-question {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .btn-enter {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 14px 40px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }

        .btn-enter:hover {
            background: transparent;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .splash-footer {
            font-size: 11px;
            color: rgba(156, 163, 175, 0.4);
            letter-spacing: 1px;
            text-align: center;
        }

        /* Scroll Reveal Başlangıç Durumu */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Form Kartı */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
            outline: none;
        }

        .form-control:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .form-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 16px;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
        }

        .footer-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .footer-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        .copyright {
            font-size: 11px;
            color: rgba(156, 163, 175, 0.5);
        }

        /* Sabit Müzik ve Sosyal Dock */
        .dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .dock-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dock-btn:hover {
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .dock-btn.music-toggle {
            color: #ff3b30;
        }
    </style>
</head>
<body>

    <!-- Minimalist Giriş Ekranı (Splash Screen) -->
    <div id="splash-screen">
        <div></div> <!-- Üst boşluk dengelemesi için -->
        <div class="splash-content">
            <div class="splash-logo">F&S</div>
            <p class="splash-question">Bizimle çalışmaya hazır mısınız?</p>
            <button class="btn-enter" onclick="enterSite()">EVET</button>
        </div>
        <div class="splash-footer">
            &copy; 2026 Fatih Sadak. Tüm hakları saklıdır.
        </div>
    </div>

    <div class="container">
        <!-- Form Alanı -->
        <div class="card reveal">
            <form id="leadForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>İsminiz</label>
                    <input type="text" id="name" class="form-control" placeholder="Adınız Soyadınız..." required>
                </div>
                
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="email" class="form-control" placeholder="E-posta adresiniz..." required>
                </div>

                <div class="form-group">
                    <label>Hizmet Seçin</label>
                    <select id="service" class="form-control">
                        <option value="Özel Çözümler">Özel Çözümler</option>
                        <option value="İtibar Yönetimi">İtibar Yönetimi</option>
                        <option value="Hesap Kurtarma">Hesap Kurtarma</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mesajınız</label>
                    <textarea id="message" class="form-control" placeholder="Sorununuzu veya projenizi kısaca anlatın..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Gönder
                </button>
                
                <div class="form-hint">Mesajınız WhatsApp üzerinden iletilecektir.</div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="reveal">
        <div class="footer-title">F&S FATİH SADAK</div>
        <p class="footer-desc">
            Hep daha iyisi için #1
        </p>
        <div class="footer-links">
            <a href="#">Hizmetler</a>
            <a href="#">İletişim</a>
            <a href="https://instagram.com/whyfatihh" target="_blank">Instagram</a>
        </div>
        <div class="copyright">&copy; 2026 Fatih Sadak. Tüm hakları saklıdır.</div>
    </footer>

    <!-- Gizli YouTube Çalar (Succession Main Title Theme) -->
    <div style="display:none;">
        <iframe id="ytPlayer" width="0" height="0" src="" allow="autoplay"></iframe>
    </div>

    <!-- Sabit Alt Dock -->
    <div class="dock reveal">
        <button class="dock-btn music-toggle" id="musicToggleBtn" onclick="toggleMusic()" title="Müziği Aç/Kapat">
            <i class="fa-solid fa-pause" id="musicIcon"></i>
        </button>
        <a href="https://instagram.com/whyfatihh" target="_blank" class="dock-btn" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com" target="_blank" class="dock-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://t.me" target="_blank" class="dock-btn" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://wa.me/905415703679" target="_blank" class="dock-btn" style="color: #25d366;" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <script>
        const musicSrc = "https://www.youtube.com/embed/LlgWqcHXD8w?enablejsapi=1&autoplay=1&loop=1&playlist=LlgWqcHXD8w";

        // "EVET" butonuna basıldığında çalışacak fonksiyon
        function enterSite() {
            // Giriş ekranını gizle
            const splash = document.getElementById('splash-screen');
            splash.classList.add('hidden');

            // Müziği başlat
            const iframe = document.getElementById('ytPlayer');
            iframe.src = musicSrc;

            // Scroll reveal elementlerini aktif et
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    el.classList.add('active');
                });
            }, 300);
        }

        // WhatsApp Form Yönlendirmesi
        function sendToWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const service = document.getElementById('service').value;
            const message = document.getElementById('message').value;

            const phone = "905415703679";
            const text = `*Yeni Talep / Mesaj*%0A%0A*İsim:* ${name}%0A*E-posta:* ${email}%0A*Hizmet:* ${service}%0A*Mesaj:* ${message}`;
            
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        // Müzik Kontrolü (YouTube Iframe Toggle)
        let isPlaying = true;
        const iframe = document.getElementById('ytPlayer');
        const musicIcon = document.getElementById('musicIcon');

        function toggleMusic() {
            if (isPlaying) {
                iframe.src = "";
                musicIcon.className = "fa-solid fa-play";
                isPlaying = false;
            } else {
                iframe.src = musicSrc;
                musicIcon.className = "fa-solid fa-pause";
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
